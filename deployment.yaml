# deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-test-app
  namespace: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cicd-test
  template:
    metadata:
      labels:
        app: cicd-test
    spec:
      containers:
        - name: cicd-test
          image: ghcr.io/kmkhm/my-java-image:latest
          ports:
            - containerPort: 8080
          imagePullPolicy: Always
      imagePullSecrets:
        - name: ghcr-secret